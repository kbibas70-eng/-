<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 이름</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo">로고</a>
      <nav class="nav">
        <a href="#features">특징</a>
        <a href="#about">소개</a>
        <a href="#contact">문의</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>여기에 메인 헤드라인을 입력하세요</h1>
        <p>한 문장으로 서비스나 제품을 설명하는 부제목입니다.</p>
        <a href="#contact" class="btn btn-primary">시작하기</a>
      </div>
    </section>

    <section id="features" class="features">
      <div class="container">
        <h2>주요 특징</h2>
        <div class="feature-grid">
          <div class="feature-card">
            <h3>특징 1</h3>
            <p>이 특징에 대한 간단한 설명을 작성하세요.</p>
          </div>
          <div class="feature-card">
            <h3>특징 2</h3>
            <p>이 특징에 대한 간단한 설명을 작성하세요.</p>
          </div>
          <div class="feature-card">
            <h3>특징 3</h3>
            <p>이 특징에 대한 간단한 설명을 작성하세요.</p>
          </div>
        </div>
      </div>
    </section>

    <section id="about" class="about">
      <div class="container">
        <h2>소개</h2>
        <p>여기에 프로젝트나 서비스에 대한 자세한 소개를 작성하세요.</p>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="container">
        <h2>문의하기</h2>
        <form class="contact-form">
          <input type="text" name="name" placeholder="이름" required>
          <input type="email" name="email" placeholder="이메일" required>
          <textarea name="message" placeholder="메시지" rows="4" required></textarea>
          <button type="submit" class="btn btn-primary">보내기</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 프로젝트 이름. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
