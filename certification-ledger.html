<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자격증명 관리대장 (로컬 저장 버전)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    color-scheme: light dark;
    --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --border:#DCE2EB;
    --ink:#1A2338; --ink-soft:#5B6580; --ink-faint:#8A93AC;
    --brand:#1B3A6B; --brand-ink:#12294D; --brand-soft:#E7EDF7;
    --gold:#A9791F; --gold-soft:#F4E8CB; --gold-ink:#6B4E12;
    --ok:#1F8A5D; --ok-bg:#E4F5EC; --ok-border:#BEE3CE;
    --warn:#B4780C; --warn-bg:#FBEFDA; --warn-border:#EED8AA;
    --danger:#B0332B; --danger-bg:#FBE9E7; --danger-border:#EFC3BE;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(19,32,63,.06), 0 8px 24px -10px rgba(19,32,63,.18);
    --font: 'Be Vietnam Pro','Noto Sans KR',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1420; --surface:#161E2E; --surface-2:#1C2536; --border:#2B3650;
      --ink:#E8ECF6; --ink-soft:#A2ACC6; --ink-faint:#707C9C;
      --brand:#7CA0DE; --brand-ink:#DCE7FA; --brand-soft:#1D2A44;
      --gold:#DCB05E; --gold-soft:#3A2E14; --gold-ink:#F0D9A0;
      --ok:#4FC98A; --ok-bg:#123423; --ok-border:#1F5A3C;
      --warn:#E4AC42; --warn-bg:#3A2C10; --warn-border:#6B4F17;
      --danger:#E7746B; --danger-bg:#3A1917; --danger-border:#6B2B26;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -12px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    padding-inline:16px; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1180px; margin:0 auto; padding-block:24px 64px;}
  h1,h2,h3{text-wrap:balance; margin:0; font-weight:800;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--brand-soft);}

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding-block:18px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px; height:42px; border-radius:10px; flex:none;
    background:linear-gradient(155deg, var(--brand), var(--brand-ink));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:15px; letter-spacing:.02em;
    box-shadow: var(--shadow);
  }
  .brand-text .co{font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase;}
  .brand-text h1{font-size:19px; color:var(--ink);}
  .topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .sync-status{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); font-weight:600; padding:4px 2px;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .sync-dot.on{background:var(--ok);}
  .sync-dot.off{background:var(--warn);}
  .sync-dot.busy{background:var(--brand); animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- banner ---------- */
  .banner{
    display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:var(--radius-sm);
    background:var(--brand-soft); border:1px solid var(--border); color:var(--ink-soft);
    font-size:12.5px; margin-bottom:18px; line-height:1.6;
  }
  .banner b{color:var(--ink);}
  .banner.warn{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn);}
  .banner.warn b{color:var(--warn);}

  /* ---------- tiles ---------- */
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:15px 16px; box-shadow:var(--shadow);
  }
  .tile .num{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
  .tile .lbl{font-size:12px; color:var(--ink-faint); margin-top:5px; font-weight:600;}
  .tile.accent .num{color:var(--brand);}
  .tile.ok .num{color:var(--ok);}
  .tile.warn .num{color:var(--warn);}
  @media (max-width:720px){ .tiles{grid-template-columns:repeat(2,1fr);} }

  /* ---------- line progress cards ---------- */
  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
  .section-title h2{font-size:15px; color:var(--ink);}
  .section-title .hint{font-size:12px; color:var(--ink-faint); font-weight:600;}
  .line-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:26px;}
  .line-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 15px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s;
  }
  .line-card:hover{border-color:var(--brand);}
  .line-card:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .line-card .lc-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .line-card .lc-name{font-weight:700; font-size:14.5px;}
  .line-card .lc-count{font-size:12px; color:var(--ink-faint); font-weight:600; font-variant-numeric:tabular-nums;}
  .bar{height:8px; border-radius:5px; overflow:hidden; display:flex; background:var(--surface-2); border:1px solid var(--border);}
  .bar span{height:100%; display:block;}
  .bar .seg-ok{background:var(--ok);}
  .bar .seg-partial{background:var(--warn);}
  .bar .seg-pending{background:var(--border);}
  .lc-legend{display:flex; gap:12px; margin-top:9px; font-size:11px; color:var(--ink-faint); font-weight:600;}
  .lc-legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}

  /* ---------- controls / toolbar ---------- */
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{
    padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    font-size:12.5px; font-weight:700; color:var(--ink-soft);
  }
  .tab.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .search{
    flex:1; min-width:160px; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:7px 14px;
  }
  .search input{border:none; background:transparent; outline:none; color:var(--ink); font-size:13px; width:100%;}
  .search svg{flex:none; opacity:.55;}
  .btn{
    padding:8px 15px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface);
    font-size:13px; font-weight:700; color:var(--ink); display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn.primary:hover{background:var(--brand-ink); border-color:var(--brand-ink);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn.danger{color:var(--danger);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .btn.stacked{flex-direction:column; gap:1px; line-height:1.25;}
  .btn-vi{font-size:10px; font-weight:600; opacity:.62; letter-spacing:.01em;}

  /* ---------- table ---------- */
  .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .table-scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    padding:11px 14px; border-bottom:1px solid var(--border); background:var(--surface-2); font-weight:700; white-space:nowrap;
  }
  tbody td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.row{cursor:pointer;}
  tbody tr.row:hover{background:var(--surface-2);}
  .cardno{font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:12.5px;}
  .needs-review{color:var(--warn); font-style:italic; font-size:12.5px;}
  .name-cell .empname{font-weight:700;}
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    font-size:11.5px; font-weight:700; border:1px solid transparent; white-space:nowrap;
  }
  .pill.ok{background:var(--ok-bg); color:var(--ok); border-color:var(--ok-border);}
  .pill.warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-border);}
  .pill.pending{background:var(--surface-2); color:var(--ink-faint); border-color:var(--border);}
  .pill.mini{padding:2px 7px; font-size:10.5px; gap:3px;}
  .pill-group{display:flex; flex-wrap:wrap; gap:4px; max-width:210px;}
  th.col-no, td.rowno{text-align:center; color:var(--ink-faint); width:44px;}
  .empty-state{padding:52px 20px; text-align:center; color:var(--ink-faint);}
  .empty-state .big{font-size:15px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}

  /* ---------- certificate detail ---------- */
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:14px; background:none; border:none; padding:0;}
  .cert{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .cert-head{
    background:linear-gradient(155deg, var(--brand), var(--brand-ink)); color:#fff;
    padding:22px 26px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start;
  }
  .cert-head .doc-title{font-size:19px; font-weight:800; letter-spacing:.01em;}
  .cert-head .doc-sub{font-size:12.5px; opacity:.85; margin-top:4px;}
  .cert-head .doc-code{font-size:11px; opacity:.75; font-variant-numeric:tabular-nums; text-align:right;}
  .cert-body{padding:24px 26px;}
  .id-row{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap-reverse;}
  .id-row .field-grid{flex:1; min-width:240px; margin-bottom:0;}
  .photo-box{width:128px; flex:none; display:flex; flex-direction:column; gap:8px; align-items:center; margin-bottom:20px;}
  .photo-frame{width:112px; height:140px; border-radius:8px; overflow:hidden; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
  .photo-frame img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-placeholder{font-size:11px; color:var(--ink-faint); text-align:center; padding:8px; line-height:1.4;}
  .avatar{width:26px; height:26px; border-radius:50%; object-fit:cover; flex:none; border:1px solid var(--border); display:inline-block; vertical-align:middle;}
  .avatar-ph{display:inline-flex; align-items:center; justify-content:center; background:var(--brand-soft); color:var(--brand); font-size:11px; font-weight:800;}
  .name-flex{display:flex; align-items:center; gap:8px;}
  .field-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 24px; margin-bottom:20px;}
  .field{border-bottom:1px solid var(--border); padding-bottom:8px;}
  .field .fl{font-size:11px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .field .fl .ko{text-transform:none; letter-spacing:0; opacity:.75; font-weight:600;}
  .field .fv{font-size:14.5px; font-weight:600; margin-top:4px; word-break:break-word;}
  .field .fv.review{color:var(--warn); font-weight:600; font-size:13px; font-style:italic;}
  .field.wide{grid-column:1/-1;}
  @media (max-width:640px){ .field-grid{grid-template-columns:1fr;} }

  .block-title{
    display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; color:var(--brand);
    margin:22px 0 10px; padding-top:14px; border-top:1px dashed var(--border);
  }
  .capability-box{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:13.5px; line-height:1.7;}

  .train-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:2px;}
  .train-table th{background:var(--surface-2); text-align:left; padding:8px 10px; border:1px solid var(--border); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);}
  .train-table td{padding:8px 10px; border:1px solid var(--border); vertical-align:top;}
  .train-table .yr{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .badge-io{font-size:11px; padding:2px 7px; border-radius:999px; font-weight:700; white-space:nowrap;}
  .badge-io.in{background:var(--ok-bg); color:var(--ok);}
  .badge-io.out{background:var(--gold-soft); color:var(--gold-ink);}

  .approve-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px;}
  @media (max-width:640px){ .approve-row{grid-template-columns:1fr;} }
  .approve-box{
    border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; background:var(--surface-2);
    display:flex; flex-direction:column;
  }
  .approve-box .ab-head{
    padding:8px 12px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    background:var(--surface); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
    color:var(--ink-soft); gap:6px;
  }
  .approve-box .ab-body{padding:16px 12px; text-align:center; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:88px;}
  .approve-box.signed .ab-body{background:var(--ok-bg);}
  .approve-box .signer-name{font-weight:800; font-size:14px; color:var(--ink);}
  .approve-box .signed-at{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .check-icon{color:var(--ok); font-size:18px;}
  .unlock-btn{border:none; background:none; color:var(--ink-faint); font-size:11px; text-decoration:underline; cursor:pointer; font-weight:600; white-space:nowrap;}

  .cert-footer{display:flex; justify-content:space-between; align-items:center; padding:14px 26px; border-top:1px solid var(--border); background:var(--surface-2); font-size:11px; color:var(--ink-faint); flex-wrap:wrap; gap:6px;}
  .cert-footer b{color:var(--ink-soft); font-weight:800; font-size:12.5px;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,15,25,.5); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius); max-width:440px; width:100%;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5); border:1px solid var(--border); max-height:88vh; overflow-y:auto;
  }
  .modal-head{padding:18px 20px 4px; display:flex; justify-content:space-between; align-items:flex-start;}
  .modal-head h3{font-size:15.5px;}
  .modal-head .sub{font-size:12px; color:var(--ink-faint); margin-top:3px;}
  .modal-body{padding:14px 20px 20px; display:flex; flex-direction:column; gap:12px;}
  .form-row{display:flex; flex-direction:column; gap:5px;}
  .form-row.two{flex-direction:row; gap:10px;}
  .form-row.two > div{flex:1; display:flex; flex-direction:column; gap:5px;}
  .form-row label{font-size:12px; font-weight:700; color:var(--ink-soft);}
  .form-row input, .form-row select, .form-row textarea{
    padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:13.5px; outline:none;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{border-color:var(--brand);}
  .form-hint{font-size:11.5px; color:var(--ink-faint); line-height:1.5;}
  .sig-pad-wrap{display:flex; flex-direction:column; gap:6px;}
  .sig-pad-canvas{width:100%; height:130px; border:1.5px dashed var(--border); border-radius:8px; background:#fff; touch-action:none; cursor:crosshair; display:block;}
  .sig-pad-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .sig-pad-status{font-size:11.5px; color:var(--ink-faint); font-weight:600;}
  .sig-pad-status.has-existing{color:var(--ok);}
  .sig-thumb{max-height:44px; max-width:140px; border:1px solid var(--border); border-radius:6px; background:#fff; padding:2px;}
  .approver-list{display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;}
  .approver-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2);}
  .approver-row-name{font-weight:700; font-size:13px; color:var(--ink);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px;}
  .form-error{font-size:12.5px; color:var(--danger); font-weight:600;}
  .modal-close{border:none; background:none; color:var(--ink-faint); font-size:18px; line-height:1; padding:2px 4px;}

  .toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.5); animation:toastin .18s ease-out;
  }
  @keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .save-warn-banner{
    position:sticky; top:0; z-index:9000; width:100%;
    background:#b91c1c; color:#fff; font-weight:700; font-size:14px;
    padding:10px 16px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .save-warn-banner .swb-btn{
    background:#fff; color:#b91c1c; border:none; border-radius:6px;
    padding:4px 10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .save-warn-banner .swb-btn:hover{ background:#fde8e8; }

  @media print{
    body *{visibility:hidden;}
    #cert-print, #cert-print *{visibility:visible;}
    #cert-print{position:absolute; top:0; left:0; width:100%;}
    .cert{box-shadow:none; border:1px solid #000;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>
<div id="saveWarnBanner" class="save-warn-banner" style="display:none;"></div>
<div id="app"></div>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="photoFile" accept="image/*" style="display:none;">
<input type="file" id="excelFile" accept=".xlsx,.xls,.xlsm" style="display:none;">

<script>
(function(){
  "use strict";

  /* ============================= helpers ============================= */
  function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // 저장된 사진 데이터가 손상되었거나(예전 버전에서 잘못 저장된 경우) 브라우저가 디코딩하지
  // 못할 때, 깨진 이미지 아이콘 대신 알아볼 수 있는 대체 화면을 보여준다.
  window.onImgLoadError = function(imgEl){
    if(!imgEl) return;
    const isAvatar = imgEl.classList.contains('avatar');
    if(isAvatar){
      const initial = imgEl.getAttribute('data-fallback') || '?';
      imgEl.outerHTML = `<span class="avatar avatar-ph">${initial}</span>`;
    } else {
      imgEl.outerHTML = '<span class="photo-placeholder">사진 표시 실패<br>(다시 등록해 주세요)</span>';
    }
  };
  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}.${m}.${day}`;
  }
  function fmtDateTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
    return `${y}.${m}.${day} ${hh}:${mm}`;
  }
  function nowIso(){ return new Date().toISOString(); }
  function compressToDataUrl(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      const cleanup = ()=>{ try{ URL.revokeObjectURL(url); }catch(e){} };
      const draw = ()=>{
        try{
          let w=img.naturalWidth, h=img.naturalHeight;
          if(!w || !h){ cleanup(); reject(new Error('이미지 크기를 읽지 못했습니다(파일이 손상되었거나 지원하지 않는 형식일 수 있습니다).')); return; }
          const scale = Math.min(1, maxDim/Math.max(w,h));
          w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          cleanup();
          const out = canvas.toDataURL('image/jpeg', quality);
          // 캔버스가 비어있거나(가로/세로 0) 결과가 비정상적으로 짧으면 실패로 처리 —
          // "등록 성공" 토스트가 뜨고도 사진이 안 보이는(빈 이미지가 저장되는) 상황을 방지.
          if(!out || out.length < 100){ reject(new Error('이미지 변환 결과가 비어 있습니다. 다른 사진으로 다시 시도해 주세요.')); return; }
          resolve(out);
        }catch(e){ cleanup(); reject(e); }
      };
      img.onload = ()=>{
        // decode()로 완전히 디코딩된 뒤에 그린다 — onload 직후 바로 그리면 큰 사진에서
        // 아직 픽셀이 다 준비되지 않아 빈 이미지가 그려지는 경우가 있어 이를 방지.
        if(typeof img.decode === 'function'){
          img.decode().then(draw).catch(draw);
        } else {
          draw();
        }
      };
      img.onerror = ()=>{ cleanup(); reject(new Error('이미지를 열 수 없습니다. 파일 형식을 확인해 주세요(JPG/PNG 권장).')); };
      img.src = url;
    });
  }
  /* Lightweight deterministic hash for approval codes (no HTTPS/crypto.subtle dependency
     needed — this file is meant to be opened directly as a local file). Not for
     high-security use; it's a simple shared-PC deterrent, matching the "간단 승인코드" design. */
  function hashCode(str){
    let h1 = 0x811c9dc5, h2 = 0x1000193;
    for(let i=0;i<str.length;i++){
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ c, 2654435761) >>> 0;
    }
    return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
  }

  const IDB_NAME = 'sjv_cert_ledger_db';

  let idbOpenPromise = null;
  function idbOpen(){
    if(idbOpenPromise) return idbOpenPromise;

      if(!('indexedDB' in window)){ reject(new Error('이 브라우저는 IndexedDB를 지원하지 않습니다.')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error || new Error('IndexedDB를 열지 못했습니다.'));
    });
    return idbOpenPromise;
  }

      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error || new Error('불러오기 실패'));
    });
  }
  async function idbSetDB(value){

      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error || new Error('저장 실패'));
    });
  }
  async function idbDeleteDB(){

  function cellRawVal(cell){
    if(!cell) return undefined;

  function cellCardNo(cell){

  function cellIso(cell){
    const v = cellRawVal(cell);

      return `${y}-${m}-${d}`;

    const s = cellText(cell);
    if(!s) return '';
    let m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/); // 01.04.2026

   *  C2=사번 H2=이름 C3=입사일 C4=라인 C5=공정 C6=근무지 C12/C13=능력, D21=추천일자,
   *  17행부터 'NGƯỜI TRÊN...' 라벨이 A열에 나올 때까지 교육이력(연도는 A열 병합, 내용 B열, 기관 C열, 내/외부 H·I열). */
  function parseSheetToEmployee(ws){
    if(!ws) return null;
    const get = (addr)=> ws[addr]; // 셀 객체 그대로 반환(t 속성으로 오류 셀 판별 위해)
    const id = cellCardNo(get('C2'));

    if(!id || !/^\d+$/.test(id)) return null;
    const capLines = [cellText(get('C12')), cellText(get('C13'))].filter(Boolean);
    const trainings = [];
    let year = '';
    for(let r=17; r<=17+60; r++){
      const aVal = cellText(get('A'+r));
      if(aVal && /NGƯỜI TRÊN|ĐỀ CỬ/i.test(aVal)) break;
      const bVal = cellText(get('B'+r));
      if(aVal) year = aVal.replace(/\s+/g,'');
      if(!bVal) continue;
      const hVal = cellText(get('H'+r)), iVal = cellText(get('I'+r));
      const type = (/√/.test(iVal) && !/√/.test(hVal)) ? 'out' : 'in';
      trainings.push({ year, type, content: bVal.replace(/\r/g,''), org: cellText(get('C'+r)), note:'' });
    }
    return {
      id,
      name: cellText(get('H2')),
      hireDate: cellIso(get('C3')),
      department: cellText(get('C4')),
      process: cellText(get('C5')),
      workplace: cellText(get('C6')),
      capability: capLines.join('\n'),
      recommendedDate: cellIso(get('D21')),
      trainings,
    };
  }

  // xlsx 안의 상대경로("../media/image1.png" 등)를 zip 내부 절대경로로 정리
  function resolveZipPath(baseDir, target){
    if(!target) return '';
    if(target.charAt(0)==='/') return target.slice(1);
    const parts = (baseDir + target).split('/');
    const stack = [];
    for(const p of parts){
      if(p==='..') stack.pop();
      else if(p==='' || p==='.') continue;
      else stack.push(p);
    }
    return stack.join('/');
  }
  const OOXML_REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  function relId(el, attr){
    return el.getAttribute(attr) || el.getAttributeNS(OOXML_REL_NS, attr.split(':').pop()) || '';
  }

  /** 엑셀(xlsx)은 사실 zip 파일이라, 시트에 꽂힌 사진은 SheetJS의 셀 값으로는 안 읽히고
   *  xl/drawings, xl/media 안에 별도로 들어있다. JSZip으로 직접 열어서
   *  워크북→시트→드로잉→이미지 관계(.rels)를 따라가며 시트별 사진 1장을 꺼낸다.
   *  실패해도(zip 손상, 사진 없음 등) 나머지 데이터 반영에는 영향 없도록 항상 best-effort로 동작. */
  async function extractPhotosFromXlsxZip(buf){
    const result = {}; // { 시트이름: dataURL }
    if(typeof JSZip === 'undefined') return result;
    const zip = await JSZip.loadAsync(buf);
    const parser = new DOMParser();
    const readXml = async (path)=>{
      const f = zip.file(path);
      if(!f) return null;
      const text = await f.async('string');
      return parser.parseFromString(text, 'application/xml');
    };
    const readRels = async (path)=>{
      const map = {};
      const doc = await readXml(path);
      if(!doc) return map;
      Array.from(doc.getElementsByTagName('Relationship')).forEach(r=>{
        map[r.getAttribute('Id')] = r.getAttribute('Target');
      });
      return map;
    };
    const wbDoc = await readXml('xl/workbook.xml');
    if(!wbDoc) return result;
    const wbRels = await readRels('xl/_rels/workbook.xml.rels');
    const sheetEls = Array.from(wbDoc.getElementsByTagName('sheet'));
    for(const sEl of sheetEls){
      const sheetName = sEl.getAttribute('name');
      const rId = relId(sEl, 'r:id');
      const target = wbRels[rId];
      if(!sheetName || !target) continue;
      const sheetPath = resolveZipPath('xl/', target);
      try{
        const sheetDoc = await readXml(sheetPath);
        if(!sheetDoc) continue;
        const drawingEls = sheetDoc.getElementsByTagName('drawing');
        if(!drawingEls.length) continue;
        const drawRId = relId(drawingEls[0], 'r:id');
        const sheetDir = sheetPath.slice(0, sheetPath.lastIndexOf('/'));
        const sheetFile = sheetPath.slice(sheetPath.lastIndexOf('/')+1);
        const sheetRels = await readRels(`${sheetDir}/_rels/${sheetFile}.rels`);
        const drawingTarget = sheetRels[drawRId];
        if(!drawingTarget) continue;
        const drawingPath = resolveZipPath(sheetDir+'/', drawingTarget);
        const drawingDoc = await readXml(drawingPath);
        if(!drawingDoc) continue;
        const blipEls = drawingDoc.getElementsByTagName('a:blip').length
          ? drawingDoc.getElementsByTagName('a:blip') : drawingDoc.getElementsByTagName('blip');
        if(!blipEls.length) continue;
        const blipRId = relId(blipEls[0], 'r:embed');
        const drawingDir = drawingPath.slice(0, drawingPath.lastIndexOf('/'));
        const drawingFile = drawingPath.slice(drawingPath.lastIndexOf('/')+1);
        const drawingRels = await readRels(`${drawingDir}/_rels/${drawingFile}.rels`);
        const imgTarget = drawingRels[blipRId];
        if(!imgTarget) continue;
        const imgPath = resolveZipPath(drawingDir+'/', imgTarget);
        const imgFile = zip.file(imgPath);
        if(!imgFile) continue;
        const base64 = await imgFile.async('base64');
        const ext = (imgPath.split('.').pop()||'').toLowerCase();
        const mime = ext==='jpg'||ext==='jpeg' ? 'image/jpeg' : ext==='gif' ? 'image/gif' : ext==='bmp' ? 'image/bmp' : 'image/png';
        result[sheetName] = `data:${mime};base64,${base64}`;
      }catch(e){ /* 이 시트만 건너뛰고 계속 진행 */ }
    }
    return result;
  }

  }

  async function parseWorkbookBuffer(buf){
    if(typeof XLSX === 'undefined') throw new Error('엑셀 파싱 라이브러리(SheetJS)를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const list = [];
    wb.SheetNames.forEach(name=>{
      const parsed = parseSheetToEmployee(wb.Sheets[name]);
      if(parsed){ parsed.sheetName = name; list.push(parsed); }
    });
    // 시트 속 사진(xl/media)은 best-effort로 추출 — 실패해도 나머지 데이터는 정상 반영
    try{
      const photosBySheet = await extractPhotosFromXlsxZip(buf);
      for(const p of list){
        const raw = photosBySheet[p.sheetName];
        if(!raw) continue;
        try{ p.photoData = await dataUrlToCompressed(raw, 480, 0.85); }
        catch(e){ /* 압축 실패 시 사진 없이 나머지 정보만 반영 */ }
      }
    }catch(e){ console.warn('엑셀 내 사진 추출을 건너뜁니다:', e); }
    return list;
  }

  // 동기화 변경 감지용 스냅샷 — 사진(base64)은 용량이 커서 제외하고, 사진 유무만 반영
  function snapshotKeyFor(list){
    return JSON.stringify(list.map(p=>({
      id:p.id, name:p.name, hireDate:p.hireDate, recommendedDate:p.recommendedDate,
      department:p.department, process:p.process, workplace:p.workplace, capability:p.capability,
      trainings:p.trainings, hasPhoto: !!p.photoData,
    })));
  }

  /** 엑셀에서 읽은 값은 "값이 있을 때만" 반영(엑셀 원본 수식오류로 비어있으면 기존에
   *  현장에서 직접 보완해둔 값을 지우지 않음). 사진도 같은 규칙 — 엑셀에 사진이 있을 때만 반영.
   *  서명·수기 추가 교육이력은 항상 보존. */
  // 파일명으로 Unit/Assy 구분 — "인원 목록" 좌측의 Unit/Assy 버튼 필터에 쓰인다.
  function categoryFromFilename(name){
    const n = (name||'').toLowerCase();
    if(n.includes('assy')) return 'Assy';
    if(n.includes('unit')) return 'Unit';
    return '';
  }

  async function applyParsedEmployees(list, opts){
    opts = opts || {};
    let added=0, updated=0;
    list.forEach(p=>{
      const existing = DB.employees[p.id];
      if(!existing){
        DB.employees[p.id] = {
          id:p.id, name:p.name, hireDate:p.hireDate, recommendedDate:p.recommendedDate,
          department:p.department, process:p.process, workplace:p.workplace, capability:p.capability,
          category: opts.category||'',
          trainings: p.trainings.map(t=>Object.assign({source:'excel'}, t)),
          signatures:{}, photoData:p.photoData||'', createdAt: nowIso(), updatedAt: nowIso(),
        };
        added++;
        return;
      }
      const fields = ['name','hireDate','recommendedDate','department','process','workplace','capability'];
      let changed = false;
      fields.forEach(f=>{ if(p[f] && p[f]!==existing[f]){ existing[f]=p[f]; changed=true; } });
      if(opts.category && opts.category!==existing.category){ existing.category = opts.category; changed = true; }
      if(p.photoData && p.photoData!==existing.photoData){ existing.photoData = p.photoData; changed = true; }
      const manualTrainings = (existing.trainings||[]).filter(t=>t.source==='manual');
      const excelTrainings = p.trainings.map(t=>Object.assign({source:'excel'}, t));
      const prevExcelJson = JSON.stringify((existing.trainings||[]).filter(t=>t.source!=='manual'));
      if(prevExcelJson !== JSON.stringify(excelTrainings)) changed = true;
      existing.trainings = manualTrainings.concat(excelTrainings);
      if(changed){ existing.updatedAt = nowIso(); updated++; }
    });
    let saved = true;
    if(added || updated) saved = await saveDB();
    return {added, updated, saved};
  }

  function runManualExcelImport(file){
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const buf = new Uint8Array(reader.result);
        const list = await parseWorkbookBuffer(buf);
        if(!list.length){ toast('엑셀에서 사번을 인식하지 못했습니다. 양식을 확인해 주세요.'); return; }
        const {added, updated, saved} = await applyParsedEmployees(list, {category: categoryFromFilename(file.name)});
        view.screen='dashboard'; render();
        if(added || updated){
          // 저장이 실제로 성공했을 때만 "완료" 메시지를 보여준다 — 저장이 실패했는데도
          // "완료했습니다"라고 나오면, 창을 닫았다 다시 열었을 때 자료가 사라져도 사용자가
          // 원인을 알 수 없기 때문. (saveDB()가 실패하면 이미 상단에 경고 배너와 토스트가 뜬다)
          exportBackup();
          if(saved){
            toast(`엑셀 반영 완료 (신규 ${added}명 · 갱신 ${updated}명) — 이 컴퓨터에 저장되었고, 백업 파일도 함께 내려받았습니다.`);
          } else {
            toast(`엑셀 내용은 화면에 반영됐지만 이 PC에는 저장하지 못했습니다(신규 ${added}명 · 갱신 ${updated}명). 위 경고를 확인하고, 방금 자동으로 내려받은 백업 파일을 꼭 보관해 주세요.`);
          }
        } else {
          toast('엑셀 반영 완료 (변경된 내용 없음)');
        }
      }catch(e){
        toast('엑셀을 읽지 못했습니다: '+(e.message||'오류'));
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function setSyncStatus(patch){ Object.assign(sync, patch); renderSyncStatusOnly(); }
  function renderSyncStatusOnly(){
    const el = document.getElementById('syncStatusLine');
    if(el) el.outerHTML = syncStatusHtml();
  }
  function syncStatusHtml(){
    let dotClass='off', text='';
    const time = sync.lastCheckedAt ? fmtDateTime(sync.lastCheckedAt).slice(11) : '';
    if(location.protocol!=='http:' && location.protocol!=='https:'){
      dotClass='off'; text = '자동 동기화 꺼짐 (파일을 서버로 열어야 작동 — 아래 안내 참고)';
    } else if(sync.mode==='checking'){ dotClass='busy'; text='엑셀 확인 중...'; }
    else if(sync.mode==='error'){ dotClass='off'; text = '자동 동기화 실패: '+sync.lastError+(time?` (마지막 확인 ${time})`:''); }
    else if(sync.mode==='synced'){ dotClass='on'; text = `엑셀 변경 반영됨 · ${time}`; }
    else if(sync.mode==='nochange'){ dotClass='on'; text = `자동 동기화 정상 · 마지막 확인 ${time}`; }
    else { dotClass='off'; text='자동 동기화 대기 중...'; }
    return `<div class="sync-status" id="syncStatusLine"><span class="sync-dot ${dotClass}"></span><span>${esc(text)}</span></div>`;
  }

  async function autoSyncTick(){
    if(location.protocol!=='http:' && location.protocol!=='https:'){ renderSyncStatusOnly(); return; }
    setSyncStatus({mode:'checking'});
    try{
      const res = await fetch(encodeURI(excelFilename()), {cache:'no-store'});
      if(!res.ok) throw new Error(`파일을 찾을 수 없음 (HTTP ${res.status})`);
      const buf = new Uint8Array(await res.arrayBuffer());
      const list = await parseWorkbookBuffer(buf);
      const snapshot = snapshotKeyFor(list);
      const now = nowIso();
      if(snapshot === DB.lastExcelSnapshot){
        setSyncStatus({mode:'nochange', lastCheckedAt:now, lastError:''});
      } else {
        const {added, updated} = await applyParsedEmployees(list, {category: categoryFromFilename(excelFilename())});
        DB.lastExcelSnapshot = snapshot;
        const syncOk = await saveDB();
        setSyncStatus({mode:'synced', lastCheckedAt:now, lastAppliedAt:now, lastError: syncOk?'':'저장 실패'});
        if(added || updated){ toast(`엑셀 변경 감지: 신규 ${added}명 · 갱신 ${updated}명 반영`+(syncOk?'':' (저장 실패 — 상단 경고 확인)')); render(); }
      }
    }catch(e){
      setSyncStatus({mode:'error', lastCheckedAt: nowIso(), lastError: e.message||'알 수 없는 오류'});
    }
  }
  function startAutoSync(){
    if(syncTimer) clearInterval(syncTimer);
    if(location.protocol!=='http:' && location.protocol!=='https:'){ renderSyncStatusOnly(); return; }
    autoSyncTick();
    syncTimer = setInterval(autoSyncTick, SYNC_POLL_MS);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) autoSyncTick(); });
  }

      <div class="modal-body">
        <div class="form-row"><label>엑셀 파일명</label><input id="sy-filename" type="text" value="${esc(excelFilename())}"></div>
        <div class="form-hint">자동 동기화는 이 html 파일을 <b>서버로 열었을 때만</b>(주소가 http://로 시작) 작동합니다. 더블클릭으로 그냥 열면(file://) 브라우저 보안 정책 때문에 옆 파일을 읽을 수 없어 자동으로는 안 되고, 상단 "엑셀 업로드" 버튼으로 수동으로 반영할 수 있습니다.</div>
        <div class="modal-actions"><button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="submit-sync-settings">저장</button></div>
      </div>`);
  }
  async function submitSyncSettings(){
    const v = document.getElementById('sy-filename').value.trim();
    if(!v) return;
    DB.settings = DB.settings || {};
    DB.settings.excelFilename = v;
    DB.lastExcelSnapshot = null;
    const ok = await saveDB();
    closeModal();
    if(ok) toast('저장했습니다.');
    startAutoSync();
  }

  function employeesArray(){
    return Object.values(DB.employees).sort((a,b)=>
      (a.department||'').localeCompare(b.department||'') ||
      (a.name||'').localeCompare(b.name||'') ||
      String(a.id).localeCompare(String(b.id))
    );
  }
  function statusOf(emp){
    const sigs = emp.signatures||{};
    const n = ROLES.filter(r=>sigs[r.key] && sigs[r.key].name).length;
    if(n===3) return 'ok';
    if(n>0) return 'warn';
    return 'pending';
  }

  /* ============================= dashboard ============================= */
  function linesSummary(){
    const map = new Map();
    employeesArray().forEach(e=>{
      const line = e.department || '(미지정)';
      if(!map.has(line)) map.set(line, {line, total:0, ok:0, warn:0, pending:0});
      const s = map.get(line);
      s.total++;
      s[statusOf(e)]++;
    });
    return Array.from(map.values()).sort((a,b)=>a.line.localeCompare(b.line));
  }

  function renderDashboard(){
    const employees = employeesArray();
    const lines = linesSummary();
    const total = employees.length;
    const ok = employees.filter(e=>statusOf(e)==='ok').length;
    const notOk = total-ok;

    const tiles = `<div class="tiles">
      <div class="tile accent"><div class="num">${total.toLocaleString()}</div><div class="lbl">전체 인원 (Tổng số)</div></div>
      <div class="tile"><div class="num">${lines.length}</div><div class="lbl">등록 라인 (Số line)</div></div>
      <div class="tile ok"><div class="num">${ok.toLocaleString()}</div><div class="lbl">결재 완료 (Đã duyệt đủ)</div></div>
      <div class="tile warn"><div class="num">${notOk.toLocaleString()}</div><div class="lbl">결재 대기/진행 (Đang chờ)</div></div>
    </div>`;

    const lineCards = lines.length ? `
      <div class="section-title"><h2>라인별 결재 현황</h2><span class="hint">라인을 클릭하면 인원 목록으로 이동합니다</span></div>
      <div class="line-cards">
        ${lines.map(s=>{
          const pOk = s.total? (s.ok/s.total*100):0, pWarn = s.total? (s.warn/s.total*100):0, pPend = s.total? (s.pending/s.total*100):0;
          return `<div class="line-card" tabindex="0" data-action="open-line" data-line="${esc(s.line)}">
            <div class="lc-top"><span class="lc-name">${esc(s.line)}</span><span class="lc-count">${s.total.toLocaleString()}명</span></div>
            <div class="bar"><span class="seg-ok" style="width:${pOk}%"></span><span class="seg-partial" style="width:${pWarn}%"></span><span class="seg-pending" style="width:${pPend}%"></span></div>
            <div class="lc-legend">
              <span><span class="dot" style="background:var(--ok)"></span>완료 ${s.ok}</span>
              <span><span class="dot" style="background:var(--warn)"></span>진행 ${s.warn}</span>
              <span><span class="dot" style="background:var(--border)"></span>대기 ${s.pending}</span>
            </div>
          </div>`;
        }).join('')}
      </div>` : '';

    return tiles + lineCards + renderEmployeeSection();
  }

  function renderEmployeeSection(){
    const all = employeesArray();
    const CATEGORY_ORDER = ['Unit','Assy'];
    const categories = Array.from(new Set(all.map(e=>e.category).filter(Boolean)))
      .sort((a,b)=> (CATEGORY_ORDER.indexOf(a)+1||99) - (CATEGORY_ORDER.indexOf(b)+1||99) || a.localeCompare(b));
    const lines = Array.from(new Set(all.map(e=>e.department||'(미지정)'))).sort();
    let list = all;
    if(view.category) list = list.filter(e=> e.category===view.category);
    if(view.line) list = list.filter(e=>(e.department||'(미지정)')===view.line);
    if(view.search){
      const q = view.search.trim().toLowerCase();
      list = list.filter(e=> String(e.id).toLowerCase().includes(q) || (e.name||'').toLowerCase().includes(q) || (e.process||'').toLowerCase().includes(q));

    const categoryTabs = categories.length ? categories.map(c=>
      `<button class="tab ${view.category===c?'active':''}" data-action="filter-category" data-category="${esc(c)}">${esc(c)}</button>`
    ).join('') : '';
    const tabs = `<div class="tabs">

      return `<tr class="row" data-action="open-detail" data-id="${esc(e.id)}">
        <td class="rowno">${idx+1}</td>
        <td class="cardno">${esc(e.id)}</td>
        <td class="name-cell"><div class="name-flex">${av}${nameCell}</div></td>
        <td>${esc(e.department||'')}</td>
        <td>${esc(e.process||'')}</td>
        <td>${fmtDate(e.hireDate)}</td>
        <td><div class="pill-group">${rolePills}</div></td>
      </tr>`;
    }).join('');

    const table = list.length ? `
      <div class="table-wrap"><div class="table-scroll">
        <table>
          <thead><tr><th class="col-no">No</th><th>사번</th><th>이름 (Tên)</th><th>라인</th><th>공정</th><th>입사일</th><th>결재상태</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div></div>` : `
      <div class="table-wrap"><div class="empty-state">
        <div class="big">등록된 인원이 없습니다</div>
        <div>'신규 인원 등록' 버튼으로 자격증명 대상자를 추가하세요.</div>
      </div></div>`;

    return `<div class="section-title"><h2>인원 목록</h2><span class="hint">${list.length.toLocaleString()}건 표시 중</span></div>` + toolbar + table;
  }

  /* ============================= 결재 싸인(서명) 패드 ============================= */
  let sigPadState = null;
  function initSignaturePad(){
    const canvas = document.getElementById('s-pad');
    if(!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const cssW = Math.max(1, rect.width), cssH = Math.max(1, rect.height || 130);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1a2130';
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cssW, cssH);
    sigPadState = { canvas, ctx, cssW, cssH, hasDrawing:false };

    let drawing = false, last = null;
    const pos = (ev)=>{ const r = canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
    const start = (ev)=>{
      drawing = true; last = pos(ev);
      if(canvas.setPointerCapture && ev.pointerId!=null){ try{ canvas.setPointerCapture(ev.pointerId); }catch(e){} }
      ev.preventDefault();
    };
    const move = (ev)=>{
      if(!drawing) return;
      const p = pos(ev);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
      if(!sigPadState.hasDrawing){ sigPadState.hasDrawing = true; updateSigPadStatus(); }
      ev.preventDefault();
    };
    const end = ()=>{ drawing = false; last = null; };
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);
    canvas.addEventListener('pointercancel', end);

    const nameEl = document.getElementById('s-name');
    if(nameEl){
      nameEl.addEventListener('input', updateSigPadStatus);
      nameEl.addEventListener('blur', updateSigPadStatus);
    }
    updateSigPadStatus();
  }
  function updateSigPadStatus(){
    const statusEl = document.getElementById('s-pad-status');
    if(!statusEl) return;
    if(sigPadState && sigPadState.hasDrawing){
      statusEl.textContent = '새로 그린 싸인이 사용됩니다';
      statusEl.classList.remove('has-existing');
      return;
    }
    const nameEl = document.getElementById('s-name');
    const key = nameEl ? nameEl.value.trim().toLowerCase() : '';
    const existing = key && DB.approvers[key];
    if(existing && existing.signatureImage){
      statusEl.textContent = '등록된 싸인을 그대로 사용합니다 (새로 그리면 교체)';
      statusEl.classList.add('has-existing');
    } else {
      statusEl.textContent = '아래에 서명을 그려 주세요 (최초 등록)';
      statusEl.classList.remove('has-existing');
    }
  }
  function clearSignaturePad(){
    if(!sigPadState) return;
    const { ctx, cssW, cssH } = sigPadState;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cssW, cssH);
    sigPadState.hasDrawing = false;
    updateSigPadStatus();
  }
  function getDrawnSignatureDataUrl(){
    if(!sigPadState || !sigPadState.hasDrawing) return null;
    return sigPadState.canvas.toDataURL('image/png');
  }

  async function submitSign(empId, role){
    const errEl = document.getElementById('s-error');
    const name = document.getElementById('s-name').value.trim();
    const pin = document.getElementById('s-pin').value.trim();
    errEl.style.display='none';
    if(!name || pin.length<4){ errEl.textContent='이름과 4자리 이상의 승인코드를 입력해 주세요.'; errEl.style.display='block'; return; }
    const key = name.toLowerCase();
    const hash = hashCode(key+':'+pin);
    const existing = DB.approvers[key];
    if(existing){
      if(existing.hash !== hash){ errEl.textContent='승인코드가 일치하지 않습니다.'; errEl.style.display='block'; return; }
    }
    const drawnImage = getDrawnSignatureDataUrl();
    const signatureImage = drawnImage || (existing && existing.signatureImage) || '';
    if(!signatureImage){
      errEl.textContent = '결재 싸인을 그려 주세요. 처음 서명하는 분은 싸인 등록이 필요합니다.';
      errEl.style.display='block';
      return;
    }
    if(existing){
      if(drawnImage) existing.signatureImage = drawnImage; // 새로 그렸다면 등록된 싸인 갱신
    } else {
      DB.approvers[key] = { name, hash, signatureImage, createdAt: nowIso() };
    }
    const emp = DB.employees[empId];
    if(!emp){ errEl.textContent='대상 인원을 찾을 수 없습니다.'; errEl.style.display='block'; return; }
    emp.signatures = emp.signatures || {};
    emp.signatures[role] = { name, signedAt: nowIso(), signatureImage };
    emp.updatedAt = nowIso();
    const ok = await saveDB();
    if(ok) toast('결재 싸인이 등록되었습니다.');
    closeModal();
    render();
  }

  async function submitResetApprover(key){
    const errEl = document.getElementById('ra-error');
    const pin = document.getElementById('ra-pin').value.trim();
    if(pin.length<4){ errEl.textContent='4자리 이상의 관리자 코드를 입력해 주세요.'; errEl.style.display='block'; return; }
    const hash = hashCode('admin:'+pin);
    if(DB.admin){
      if(DB.admin.hash !== hash){ errEl.textContent='관리자 코드가 일치하지 않습니다.'; errEl.style.display='block'; return; }
    } else {
      DB.admin = { hash, createdAt: nowIso() };
    }
    const a = DB.approvers[key];
    const name = a ? a.name : key;
    delete DB.approvers[key];
    const ok = await saveDB();
    if(ok) toast(`'${name}' 님의 승인코드가 초기화되었습니다. 다음 서명 시 새 코드와 싸인을 등록하면 됩니다.`);
    modalApproverAdmin();
  }

  async function handlePhotoFile(empId, file){
    const emp = DB.employees[empId];
    if(!emp) return;
    try{
      toast('사진 처리 중...');
      const dataUrl = await compressToDataUrl(file, 480, 0.85);
      emp.photoData = dataUrl;
      emp.updatedAt = nowIso();
      const ok = await saveDB();
      if(ok) toast('사진이 등록되었습니다.');
      render();
    }catch(e){
      toast('사진 등록 실패: '+(e.message||'오류'));
    }

  async function deleteEmployee(id){
    if(!confirm(`사번 ${id} 인원을 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
    delete DB.employees[id];
    const ok = await saveDB();
    if(ok) toast('삭제되었습니다.');
    view.screen='dashboard'; view.empId=null;

  /* ============================= backup export / import ============================= */
  function exportBackup(){
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    const a = document.createElement('a');
    a.href = url; a.download = `자격증명_백업_${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('백업 파일을 내려받았습니다.');
  }

  /* ============================= 전체 자료 → 엑셀 다운로드 (업로드 원본과 같은 양식) =============================
     업로드하는 CHỨNG CHỈ U1.xlsm은 "직원 1명 = 시트 1장" 구조로, 시트마다 정해진 칸에 라벨·테두리·
     배경색까지 정해진 양식지가 있고(사번 C2/이름 H2/입사일 C3/부서 C4/공정 C5/근무지 C6/능력
     C12,C13/추천일자 D21/교육이력 17행부터 — parseSheetToEmployee가 읽는 바로 그 칸들), 사진과
     결재 싸인은 별도 그림으로 그 위에 얹혀 있다. 다운로드도 이 양식을 그대로 재현한다.
     SheetJS(XLSX) 무료 버전은 셀 서식이나 그림을 써주는 기능이 없어서, XLSX는 엑셀 "업로드"
     파싱에만 쓰고, 이 다운로드는 xlsx 파일(=zip) 내부 XML을 JSZip으로 직접 만들어
     테두리·굵은 글씨·배경색·병합·사진·결재 싸인까지 전부 담는다. */
  function colLetter(n){ let s=''; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
  function cellAddr(col, row){ return colLetter(col)+row; }

  const CERT_STYLE_IDX = { title:1, section:2, header:3, label:4, valueLeft:5, valueCenter:6, dateCenter:7, blank:8 };
  const CERT_STYLES_XML = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<borders count="2">

</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>

<xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top" wrapText="1"/></xf>

<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

  function certPhotoMimeExt(dataUrl){
    const m = /^data:image\/(png|jpeg|jpg|gif|bmp);base64,(.*)$/s.exec(dataUrl||'');
    if(!m) return null;
    return { ext: m[1]==='jpg'?'jpeg':m[1], base64: m[2] };
  }
  const CERT_SIGN_COLS = { preparer:8, checker:9, approver:10 }; // H/I/J
  function certRecRow(emp){ return 17 + (emp.trainings||[]).length; } // "NGƯỜI TRÊN ĐƯỢC ĐỀ CỬ NGÀY" 행
  function certSheetImages(emp){
    const imgs = [];
    const photo = certPhotoMimeExt(emp.photoData);
    if(photo) imgs.push(Object.assign({name:'photo', fromCol:8, fromRow:2, toCol:10, toRow:7}, photo));
    const recRow = certRecRow(emp);
    ROLES.forEach(role=>{
      const col = CERT_SIGN_COLS[role.key];
      const sig = emp.signatures && emp.signatures[role.key];
      const parsed = sig && certPhotoMimeExt(sig.signatureImage);
      if(parsed) imgs.push(Object.assign({name:role.key, fromCol:col-1, fromRow:recRow, toCol:col, toRow:recRow+1}, parsed));
    });
    return imgs;
  }

  function buildCertSheetXml(emp, hasDrawing){
    const NCOLS = 10, set = {};
    const put = (a, styleKey, value, type)=>{ set[a] = {style: CERT_STYLE_IDX[styleKey], value, type: type||'s'}; };
    put('A1','title','GIẤY CHỨNG NHẬN ĐỦ ĐIỀU KIỆN');
    put('A2','label','SỐ THẺ:  ');            put('C2','valueCenter', emp.id);
    put('G2','label','Name : ');              put('H2','valueCenter', emp.name||'');
    put('B3','label','NGÀY VÀO LÀM:  ');
    if(emp.hireDate) put('C3','dateCenter', emp.hireDate,'d'); else put('C3','valueCenter','');
    put('B4','label','BỘ PHẬN:');             put('C4','valueCenter', emp.department||'');
    put('B5','label','CÔNG ĐOẠN:');           put('C5','valueCenter', emp.process||'');
    put('B6','label','NƠI LÀM VIỆC:  ');      put('C6','valueCenter', emp.workplace||'');
    put('B7','section','▣ TRÌNH ĐỘ CHUYÊN MÔN');
    put('A8','header','PHÂN LOẠI'); put('C8','header','CHI TIẾT'); put('H8','header','NỘI DUNG KHÁC');
    put('A9','label','KINH NGHIỆM LÀM VIỆC');
    put('A12','label','NĂNG LỰC LÀM VIỆC');
    const capLines = (emp.capability||'').split('\n');
    put('C12','valueLeft', capLines[0]||''); put('C13','valueLeft', capLines[1]||'');
    put('B15','section','▣ TÌNH TRẠNG ĐÀO TẠO');
    put('A16','header','NĂM'); put('B16','header','LOẠI HÌNH ĐÀO TẠO'); put('C16','header','CƠ QUAN ĐÀO TẠO');
    put('E16','header','LỊCH ĐÀO TẠO'); put('G16','header','THỜI GIAN ĐÀO TẠO'); put('H16','header','PHÂN LOẠI'); put('J16','header','GHI CHÚ');

    const cleanRaw = (s)=> (s||'').replace(/\r\n?/g,'\n');
    const trainings = emp.trainings || [];
    const startRow = 17;
    trainings.forEach((t,i)=>{
      const r = startRow+i;
      if(i===0 || t.year !== trainings[i-1].year) put('A'+r,'valueCenter', t.year||'');
      put('B'+r,'valueLeft', cleanRaw(t.content));
      put('C'+r,'valueLeft', cleanRaw(t.org));
      if(t.type==='out') put('I'+r,'valueCenter','√□NGOÀI CTY'); else put('H'+r,'valueCenter','√□TRONG CTY');
      if(t.note) put('J'+r,'valueLeft', cleanRaw(t.note));
    });

    const recRow = certRecRow(emp);
    put('A'+recRow,'label','NGƯỜI TRÊN ĐƯỢC ĐỀ CỬ NGÀY ');
    if(emp.recommendedDate) put('D'+recRow,'dateCenter', emp.recommendedDate,'d'); else put('D'+recRow,'valueCenter','');
    put('H'+recRow,'header','NGƯỜI LẬP'); put('I'+recRow,'header','KIỂM TRA'); put('J'+recRow,'header','DUYỆT');
    const docRow = recRow + 2;
    put('A'+docRow,'valueLeft', DOC_CODE); put('J'+docRow,'valueCenter', COMPANY+' ');

    const merges = [];
    const M = (r1,c1,r2,c2)=> merges.push([r1,c1,r2,c2]);
    M(1,1,1,10); M(2,1,2,2); M(2,3,2,6); M(2,8,2,10); M(3,3,3,8); M(4,3,4,8); M(5,3,5,8); M(6,3,6,8);
    M(7,4,7,8); M(3,9,7,10);
    M(8,1,8,2); M(8,3,8,7); M(8,8,8,10);
    M(9,1,11,2); M(9,3,9,7); M(10,3,10,7); M(11,3,11,7);
    M(12,1,14,2); M(12,3,12,7); M(13,3,13,7); M(14,3,14,7);
    M(16,5,16,6); M(16,8,16,9);
    if(trainings.length>0){
      let yearStart = startRow;
      trainings.forEach((t,i)=>{
        const r = startRow+i;
        if(i>0 && t.year !== trainings[i-1].year) yearStart = r;
        const isLastOfYear = (i===trainings.length-1) || (trainings[i+1].year !== t.year);
        if(isLastOfYear && r > yearStart) M(yearStart,1,r,1);
        M(r,3,r,4); M(r,5,r,6);
      });
    }
    M(recRow,1,recRow+1,3); M(recRow,4,recRow+1,7);

    const inMerge = new Set();
    merges.forEach(([r1,c1,r2,c2])=>{
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ if(r===r1&&c===c1) continue; inMerge.add(cellAddr(c,r)); }
    });

    const excelEpoch = Date.UTC(1899,11,30);
    const dateSerial = (isoStr)=> Math.round((new Date(isoStr+'T00:00:00Z').getTime()-excelEpoch)/86400000);
    // 원본 CHỨNG CHỈ U1.xlsm의 실제 시트(1-155830-SL)에서 그대로 읽어온 행 높이 값.
    // 1~16행은 항상 이 값 그대로, 교육이력 행(17행부터)은 원본처럼 88.5로 반복,
    // 그 다음 추천일자 행(19.5)·서명 행(81)·문서번호 행(18)이 뒤따른다.
    const FIXED_ROW_HEIGHTS = {1:54,2:28.5,3:27,4:27,5:27,6:27,7:27,8:26.25,9:33.75,10:33.75,11:33.75,12:33.75,13:33.75,14:33.75,15:21.75,16:28.5};
    const rowHeight = (r)=>{
      if(FIXED_ROW_HEIGHTS[r] !== undefined) return FIXED_ROW_HEIGHTS[r];
      if(r >= startRow && r < recRow) return 88.5;
      if(r === recRow) return 19.5;
      if(r === recRow+1) return 81;
      if(r === docRow) return 18;
      return undefined;
    };
    let rowsXml = '';
    for(let r=1;r<=docRow;r++){
      let cellsXml = '';
      for(let c=1;c<=NCOLS;c++){
        const a = cellAddr(c,r);
        const cell = set[a];
        if(cell){
          if(cell.type==='d'){
            cellsXml += `<c r="${a}" s="${cell.style}"><v>${dateSerial(cell.value)}</v></c>`;
          } else {
            const text = String(cell.value);
            cellsXml += text==='' ? `<c r="${a}" s="${cell.style}"/>`
              : `<c r="${a}" s="${cell.style}" t="inlineStr"><is><t xml:space="preserve">${esc(text)}</t></is></c>`;
          }
        } else {
          cellsXml += `<c r="${a}" s="${CERT_STYLE_IDX.blank}"/>`;
        }
      }
      const ht = rowHeight(r);
      rowsXml += `<row r="${r}"${ht?` ht="${ht}" customHeight="1"`:''}>${cellsXml}</row>`;
    }

    const mergeXml = merges.length
      ? `<mergeCells count="${merges.length}">` + merges.map(([r1,c1,r2,c2])=>`<mergeCell ref="${cellAddr(c1,r1)}:${cellAddr(c2,r2)}"/>`).join('') + `</mergeCells>`
      : '';
    // 원본 시트의 실제 열 너비(A~J) 그대로.
    const colsXml = `<cols>` + [6.33203125,23.33203125,10.5546875,13.33203125,7.33203125,8.33203125,13.33203125,13.88671875,14.109375,12.109375].map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + `</cols>`;
    const drawingXml = hasDrawing ? `<drawing r:id="rIdDrawing"/>` : '';

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<dimension ref="A1:${cellAddr(NCOLS,docRow)}"/>
<sheetViews><sheetView workbookViewId="0"/></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
${colsXml}
<sheetData>${rowsXml}</sheetData>
${mergeXml}
${drawingXml}
</worksheet>`;
  }

  function buildCertDrawingXml(pics){
    const anchors = pics.map((p,i)=>`<xdr:twoCellAnchor>
<xdr:from><xdr:col>${p.fromCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${p.fromRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from>
<xdr:to><xdr:col>${p.toCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${p.toRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>
<xdr:pic>
<xdr:nvPicPr><xdr:cNvPr id="${i+1}" name="${esc(p.name)}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>
<xdr:blipFill><a:blip r:embed="${p.embedId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>
<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>
</xdr:pic>

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
${anchors}
</xdr:wsDr>`;
  }

  async function buildCertWorkbookZip(employees){
    const zip = new JSZip();
    const imagesBySheet = employees.map(certSheetImages);

    zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Default Extension="png" ContentType="image/png"/>
<Default Extension="jpeg" ContentType="image/jpeg"/>
<Default Extension="gif" ContentType="image/gif"/>
<Default Extension="bmp" ContentType="image/bmp"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${employees.map((e,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('\n')}
${employees.map((e,i)=> imagesBySheet[i].length ? `<Override PartName="/xl/drawings/drawing${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>` : '').filter(Boolean).join('\n')}
</Types>`);
    zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`);

    const usedNames = new Set();
    const sheetNames = employees.map(e=>{
      let n = String(e.id).replace(/[\\/*?:\[\]]/g,'_').slice(0,31) || 'sheet';
      while(usedNames.has(n)) n = (n+'_').slice(-31);
      usedNames.add(n);
      return n;
    });

    zip.file('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>
${employees.map((e,i)=>`<sheet name="${esc(sheetNames[i])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('\n')}
</sheets>
</workbook>`);

    zip.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${employees.map((e,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('\n')}
<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`);

    zip.file('xl/styles.xml', CERT_STYLES_XML);

    employees.forEach((e,i)=>{
      const imgs = imagesBySheet[i];
      zip.file(`xl/worksheets/sheet${i+1}.xml`, buildCertSheetXml(e, imgs.length>0));
      if(imgs.length){
        zip.file(`xl/worksheets/_rels/sheet${i+1}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rIdDrawing" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${i+1}.xml"/>
</Relationships>`);
        const pics = imgs.map((img,j)=> Object.assign({embedId:'rIdImg'+j}, img));
        zip.file(`xl/drawings/drawing${i+1}.xml`, buildCertDrawingXml(pics));
        zip.file(`xl/drawings/_rels/drawing${i+1}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${imgs.map((img,j)=>`<Relationship Id="rIdImg${j}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image${i+1}_${j}.${img.ext}"/>`).join('\n')}
</Relationships>`);
        imgs.forEach((img,j)=>{ zip.file(`xl/media/image${i+1}_${j}.${img.ext}`, img.base64, {base64:true}); });
      }
    });

    return zip;
  }

  async function exportDataExcel(){
    if(typeof JSZip === 'undefined'){ toast('엑셀 내보내기 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }
    const all = employeesArray();
    if(!all.length){ toast('등록된 인원이 없습니다.'); return; }
    toast('엑셀 만드는 중...');
    try{
      const zip = await buildCertWorkbookZip(all);
      const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url = URL.createObjectURL(blob);
      const d = new Date();
      const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
      const a = document.createElement('a');
      a.href = url; a.download = `자격증명_${stamp}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast(`엑셀을 내려받았습니다 (${all.length}명, 업로드 원본과 같은 양식 — 사진·서명 포함).`);
    }catch(e){
      console.error('exportDataExcel failed', e);
      toast('엑셀을 만들지 못했습니다: '+(e.message||'오류'));
    }
  }

  /* ============================= 서명 이력 → 엑셀 내보내기 =============================
     원본 결재문서 엑셀(xlsm)을 직접 덮어쓰는 것은 브라우저 보안 정책상 이 파일(file://로 여는
     방식)에서는 안전하게 할 수 없어서, 대신 "누가 언제 서명했는지"를 정리한 새 엑셀 파일을
     매번 새로 만들어 내려받는 방식으로 제공한다. */
  function exportSignatureExcel(){
    if(typeof XLSX === 'undefined'){ toast('엑셀 내보내기 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }
    const all = employeesArray();
    const header = [
      '사번','이름','라인','공정','입사일',
      'NGƯỜI LẬP (작성자)','작성자 서명일시',
      'KIỂM TRA (확인자)','확인자 서명일시',
      'DUYỆT (승인자)','승인자 서명일시',
      '결재상태'
    ];
    const roleCell = (sigs, key)=>{
      const s = sigs[key];
      return [ (s && s.name) || '', (s && s.signedAt) ? fmtDateTime(s.signedAt) : '' ];
    };
    const rows = all.map(e=>{
      const sigs = e.signatures || {};
      const st = statusOf(e);
      const stLabel = st==='ok' ? '결재완료' : st==='warn' ? '진행중' : '미결재';
      const [prepName, prepAt] = roleCell(sigs, 'preparer');
      const [checkName, checkAt] = roleCell(sigs, 'checker');
      const [apprName, apprAt] = roleCell(sigs, 'approver');
      return [
        e.id, e.name||'', e.department||'', e.process||'', e.hireDate?fmtDate(e.hireDate):'',
        prepName, prepAt, checkName, checkAt, apprName, apprAt, stLabel
      ];
    });
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = [
      {wch:9},{wch:22},{wch:15},{wch:20},{wch:11},
      {wch:16},{wch:17},{wch:16},{wch:17},{wch:16},{wch:17},{wch:9}
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '서명이력');
    const d = new Date();
    const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    XLSX.writeFile(wb, `서명이력_${stamp}.xlsx`);
    toast(`서명 이력 엑셀을 내려받았습니다 (${all.length}명).`);
  }

  /* ============================= events ============================= */
  function bindGlobalEvents(){
    const app = document.getElementById('app');
    app.oninput = (ev)=>{
      if(ev.target.id==='searchInput'){ view.search = ev.target.value; scheduleFilterRender(); }
    };
    app.onclick = (ev)=>{
      const t = ev.target.closest('[data-action]');
      if(!t) return;
      const action = t.dataset.action;
      ev.preventDefault();
      if(action==='open-line'){ view.line=t.dataset.line; render(); }
      if(action==='filter-line'){ view.line = t.dataset.line || null; render(); }
      if(action==='filter-category'){ view.category = (view.category===t.dataset.category) ? null : t.dataset.category; render(); }
      if(action==='open-detail'){ view.screen='detail'; view.empId=t.dataset.id; render(); window.scrollTo(0,0); }
      if(action==='go-dashboard'){ view.screen='dashboard'; view.empId=null; render(); }
      if(action==='add-employee'){ modalAddEmployee(); }
      if(action==='add-training'){ modalAddTraining(view.empId); }
      if(action==='del-training'){ deleteTraining(view.empId, Number(t.dataset.idx)); }
      if(action==='open-sign'){ modalSign(t.dataset.empid, t.dataset.role); }
      if(action==='unlock-sig'){ modalUnlock(t.dataset.empid, t.dataset.role); }
      if(action==='delete-employee'){ deleteEmployee(t.dataset.id); }
      if(action==='print-cert'){ window.print(); }
      if(action==='pick-photo'){ pendingPhotoEmpId = t.dataset.empid; document.getElementById('photoFile').click(); }
      if(action==='import-excel'){ document.getElementById('excelFile').click(); }
      if(action==='sync-settings'){ modalSyncSettings(); }
      if(action==='approver-admin'){ modalApproverAdmin(); }
      if(action==='export-data'){ exportDataExcel(); }
      if(action==='export-sign-log'){ exportSignatureExcel(); }
      if(action==='manual-save'){ saveDB().then(ok=>{ if(ok) toast('저장되었습니다. 이 PC·브라우저에서 다시 열어도 이 내용이 보입니다.'); }); }
      if(action==='reset-local'){
        const ok = confirm('이 컴퓨터·브라우저에 저장된 데이터를 모두 지우고, 이 html 파일에 들어있는 최신 데이터로 다시 시작합니다.\n\n이 PC에서 직접 입력했던 서명·사진·수정 내용이 있다면 함께 사라집니다. 계속할까요?');
        if(!ok) return;
        Promise.resolve()
          .then(()=> idbDeleteDB().catch(()=>{}))
          .then(()=>{ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} })
          .then(()=> location.reload());
      }
    };
  }

  document.getElementById('photoFile').addEventListener('change', (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    const empId = pendingPhotoEmpId;
    if(file && empId) handlePhotoFile(empId, file);
  });

  let filterTimer=null;
  function scheduleFilterRender(){
    clearTimeout(filterTimer);
    filterTimer = setTimeout(()=>{
      const el = document.getElementById('searchInput');
      const pos = el ? el.selectionStart : null;
      render();
      const el2 = document.getElementById('searchInput');
      if(el2 && pos!==null){ el2.focus(); el2.setSelectionRange(pos,pos); }
    }, 120);
  }

  document.getElementById('modalRoot').addEventListener('click', (ev)=>{
    if(ev.target.hasAttribute('data-close-backdrop')) closeModal();
    const t = ev.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;
    if(action==='close-modal') closeModal();
    if(action==='submit-employee') submitEmployee();
    if(action==='submit-training') submitTraining(t.dataset.empid);
    if(action==='submit-sign') submitSign(t.dataset.empid, t.dataset.role);
    if(action==='submit-unlock') submitUnlock(t.dataset.empid, t.dataset.role);
    if(action==='submit-sync-settings') submitSyncSettings();
    if(action==='clear-sigpad') clearSignaturePad();
    if(action==='open-approver-admin') modalApproverAdmin();
    if(action==='reset-approver') modalResetApprover(t.dataset.key);
    if(action==='submit-reset-approver') submitResetApprover(t.dataset.key);
  });

  document.getElementById('excelFile').addEventListener('change', (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if(file) runManualExcelImport(file);
  });

  /* ============================= boot ============================= */
  (async function boot(){
    await loadDB();
    render();
    startAutoSync();
  })();
})();
</script>
